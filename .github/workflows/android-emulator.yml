name: Android emulator startup

on:
  workflow_dispatch:
  push:
    branches: [feature/rkb-rust-foundation]

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  startup:
    name: API 34 emulator launch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install SDK platform, build tools, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Rust and Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - name: Cross-compile ARM64 library
        run: ./scripts/build-android.sh
      - name: Cross-compile x86_64 emulator library
        run: |
          RKB_TARGET=x86_64-linux-android RKB_ABI=x86_64 ./scripts/build-android.sh
          file android/app/src/main/jniLibs/x86_64/librkb_android.so
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper
      - name: Build universal debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -Prkb.abis=arm64-v8a,x86_64 --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app in emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # Suppress the one-time immersive-mode cling so the screenshot
            # shows the rendered app instead of the system overlay.
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c
            adb shell am start -W -n com.rkb.rust/.MainActivity
            sleep 15

            adb exec-out screencap -p > emulator-screen.png
            adb shell dumpsys activity activities > emulator-activities.txt
            adb shell ps -A > emulator-ps.txt || true
            adb shell pidof com.rkb.rust > emulator-pidof.txt || true
            adb logcat -d > emulator-logcat.txt

            # `pidof` is unreliable on some Android images (it returned empty
            # on API 34 while the activity was resumed), so accept any of the
            # independent liveness signals.
            alive=0
            if grep -q 'com\.rkb\.rust' emulator-pidof.txt; then alive=1; fi
            if grep -q 'com\.rkb\.rust' emulator-ps.txt; then alive=1; fi
            if grep -q 'topResumedActivity=ActivityRecord{.*com\.rkb\.rust/' emulator-activities.txt; then alive=1; fi
            if [ "$alive" -ne 1 ]; then
              echo "::error::com.rkb.rust is not running after launch"
              cat emulator-pidof.txt || true
              grep -n 'com\.rkb\.rust' emulator-ps.txt emulator-activities.txt || true
              exit 1
            fi

            grep -q 'state=RESUMED' emulator-activities.txt
            grep -q 'RKB RUST native version' emulator-logcat.txt
            grep -q 'native engine created' emulator-logcat.txt
            grep -q 'first frame presented' emulator-logcat.txt

            if grep -qE 'FATAL EXCEPTION|Fatal signal|Abort message|UnsatisfiedLinkError' emulator-logcat.txt; then
              grep -n -B2 -A60 -E 'FATAL EXCEPTION|Fatal signal|Abort message|UnsatisfiedLinkError' emulator-logcat.txt
              exit 1
            fi
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rkb-emulator-startup
          path: |
            emulator-logcat.txt
            emulator-activities.txt
            emulator-ps.txt
            emulator-pidof.txt
            emulator-screen.png
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
