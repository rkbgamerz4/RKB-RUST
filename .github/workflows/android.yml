name: Android ARM64

on:
  push:
    branches: [feature/rkb-rust-foundation, feature/mc-java-protocol]
  pull_request:
    paths:
      - "android/**"
      - "crates/rkb-android/**"
      - "crates/rkb-core/**"
      - "crates/rkb-input/**"
      - "crates/rkb-platform/**"
      - "crates/rkb-render/**"
      - "crates/rkb-resource/**"
      - "crates/rkb-runtime/**"
      - "crates/rkb-sandbox/**"
      - "crates/rkb-mc/**"
      - "scripts/build-android.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  apk:
    name: NDK cross-compile and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install SDK platform, build tools, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Rust and Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - name: Cross-compile native library
        run: ./scripts/build-android.sh
      - name: Check Minecraft world-data crate for ARM64 Android
        run: cargo check --locked --release --target aarch64-linux-android -p rkb-mc
      - name: Inspect native library
        run: |
          file android/app/src/main/jniLibs/arm64-v8a/librkb_android.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/librkb_android.so
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK contents, manifest, and ABI
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" > apk-contents.txt
          grep -q '^lib/arm64-v8a/librkb_android\.so$' apk-contents.txt
          OTHER_ABIS="$(grep '^lib/' apk-contents.txt | grep -v '^lib/arm64-v8a/' || true)"
          if [ -n "$OTHER_ABIS" ]; then
            echo "unexpected non-ARM64 native entries:"
            echo "$OTHER_ABIS"
            exit 1
          fi
          AAPT="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.rkb.rust'" apk-badging.txt
          grep -q "sdkVersion:'24'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          grep -q "launchable-activity: name='com.rkb.rust.MainActivity'" apk-badging.txt
          file android/app/src/main/jniLibs/arm64-v8a/librkb_android.so > native-file.txt
          grep -q 'ARM aarch64' native-file.txt
          {
            echo '### APK verification'
            echo '```'
            grep -E "package:|sdkVersion:|targetSdkVersion:|launchable-activity:" apk-badging.txt
            grep '^lib/arm64-v8a/librkb_android\.so$' apk-contents.txt
            cat native-file.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rkb-apk-verification
          path: |
            apk-contents.txt
            apk-badging.txt
            native-file.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rkb-rust-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librkb_android-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/librkb_android.so
          if-no-files-found: error
          retention-days: 14
